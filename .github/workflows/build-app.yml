name: Build Apps
on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'   # Runs when you push a version tag

  workflow_dispatch:
jobs:
  Build-Windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run package
      - name: Zip the directory
        run: |
          Compress-Archive -Path Strypify-win32-x64 -DestinationPath Strypify-win32-x64.zip
        shell: powershell
      - name: Archive Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Strypify-windows-x64
          path: |
            Strypify-win32-x64.zip

  Build-Mac-App-Aarch:
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
      #- name: Install the Apple certificate and provisioning profile
      #  env:
      #    BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      #    KEYCHAIN_PASSWORD: Vh4o2zhsnBE5f
      #  run: |
      #    # From https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      #    # create variables
      #    CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #    KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #
      #    # import certificate and provisioning profile from secrets
      #    echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
      #
      #    # create temporary keychain
      #    security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #    security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
      #    security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #
      #    # import certificate to keychain
      #    security import $CERTIFICATE_PATH -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      #    security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run package
      #- name: Sign
      #  run: |
      #    npm run sign -- --identity="Developer ID Application: ${{ secrets.DEVELOPER_NAME }}"
      #- name: Notarize
      #  run: |
      #    /usr/bin/ditto -c -k --keepParent Strypify-darwin-arm64/Strypify.app notarize.zip
      #    xcrun notarytool submit --apple-id ${{ secrets.APPLEID_EMAIL }} --password ${{ secrets.APPLEID_PASSWORD }} --team-id ${{ secrets.APPLEID_TEAMID }} --wait notarize.zip
      #    ditto -x -k notarize.zip .
      #    xcrun stapler staple Strypify.app
      #    /usr/bin/ditto -c -k --keepParent Strypify.app Strypify.zip
      - name: Zip
        run: |
          /usr/bin/ditto -c -k --keepParent Strypify-darwin-arm64/Strypify.app Strypify-macos-aarch64.zip
      - name: Archive Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Strypify-mac-aarch
          path: |
            Strypify-macos-aarch64.zip

  Build-Ubuntu-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm install
      - name: Build
        run: |
          npm run package
          chmod +x strypify-headless.sh
          cp strypify-headless.sh Strypify-linux-x64/
      - name: Zip the directory
        run: |
          zip -r Strypify-linux-x64.zip Strypify-linux-x64
      - name: Archive Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Strypify-linux-x64
          path: |
            Strypify-linux-x64.zip
      - name: Archive Asciidoctor plugin
        uses: actions/upload-artifact@v4
        with:
          name: strypify-plugin.rb
          path: |
            asciidoctor/strypify-plugin.rb            

  Test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs:
      - Build-Ubuntu-x64
      - Build-Windows-x64
      - Build-Mac-App-Aarch
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            artifact: Strypify-linux-x64
            # Directory (relative to the repo root) that contains the Strypify executable once unpacked:
            bindir: artifact/Strypify-linux-x64
          - name: Windows
            os: windows-latest
            artifact: Strypify-windows-x64
            bindir: artifact/Strypify-win32-x64
          - name: macOS
            os: macos-latest
            artifact: Strypify-mac-aarch
            bindir: artifact/Strypify.app/Contents/MacOS
    defaults:
      run:
        shell: bash
    env:
      # Keep Strypify's stderr (with Electron logging) from headless runs, to diagnose stalled launches:
      STRYPIFY_HEADLESS_LOG_DIR: ${{ github.workspace }}/headless-logs
      STRYPIFY_HEADLESS_DEBUG: 1
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Strypify artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ./artifact

    - name: Unzip Strypify
      run: |
        case "$RUNNER_OS" in
          Linux)   unzip artifact/Strypify-linux-x64.zip -d ./artifact ;;
          Windows) powershell -Command "Expand-Archive -Path artifact/Strypify-win32-x64.zip -DestinationPath artifact" ;;
          macOS)   ditto -x -k artifact/Strypify-macos-aarch64.zip ./artifact ;;
        esac

    - name: Ensure Strypify is executable
      if: runner.os == 'Linux'
      run: chmod +x ./artifact/Strypify-linux-x64/Strypify

    - name: Install Xvfb
      if: runner.os == 'Linux'
      run: sudo apt-get install -y xvfb

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python packages
      run: |
        python3 -m pip install --upgrade pip || python -m pip install --upgrade pip
        python3 -m pip install Pillow imagehash || python -m pip install Pillow imagehash

    # The reference images are renders from one platform, so the pixel comparison is Linux-only.
    # (The plugin test below compares HTML, so runs everywhere.)
    - name: Run Strypify and check image
      if: runner.os == 'Linux'
      working-directory: test
      run: |
        ls -lrt "../${{ matrix.bindir }}/"
        export PATH="$(realpath "../${{ matrix.bindir }}/"):$PATH"
        bash ./run-indiv-tests.sh
    - name: Upload generated images if tests failed
      if: failure() && runner.os == 'Linux'  # only runs if previous step failed
      uses: actions/upload-artifact@v4
      with:
        name: failed-images-${{ matrix.name }}
        path: 'test/actual-*.png'

    - name: Install dependencies for plugin test (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ruby-full wget unzip xvfb libxml2-utils
        sudo gem install asciidoctor
        sudo gem install asciidoctor-pdf
    - name: Install dependencies for plugin test (macOS)
      if: runner.os == 'macOS'
      run: |
        gem install asciidoctor
        gem install asciidoctor-pdf
        # The plugin looks for Strypify in this fixed location on macOS:
        cp -R artifact/Strypify.app /Applications/Strypify.app
    - name: Install dependencies for plugin test (Windows)
      if: runner.os == 'Windows'
      run: |
        gem install asciidoctor
        gem install asciidoctor-pdf
        # The test scripts use xmllint, which is not included with Git Bash:
        choco install xsltproc --no-progress -y
    - name: Test plugin output
      working-directory: test/plugin
      run: |
        ls -lrt "../../${{ matrix.bindir }}/"
        export PATH="$(realpath "../../${{ matrix.bindir }}/"):$PATH"
        bash ./run-test.sh
    - name: Upload headless Strypify logs
      if: always() && runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: headless-logs-${{ matrix.name }}
        path: headless-logs/
        if-no-files-found: ignore
    - name: Upload plugin output if tests failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failed-plugin-output-${{ matrix.name }}
        path: |
          test/plugin/*.html
          test/plugin/*.log

  Validate-Version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run for version tags

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: tag
      run: echo "TAG_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Read version from package.json
      id: pkg
      run: echo "PKG_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

    - name: Compare versions
      run: |
        echo "Tag version: $TAG_VERSION"
        echo "Package.json version: $PKG_VERSION"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "Version mismatch: tag = $TAG_VERSION, package.json = $PKG_VERSION"
          exit 1
        fi
  Release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run for version tags
    needs:
      - Build-Windows-x64
      - Build-Ubuntu-x64
      - Build-Mac-App-Aarch
      - Test
      - Validate-Version
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
